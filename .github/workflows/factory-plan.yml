name: Propose approved issue work
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: factory-read-only-plan
  cancel-in-progress: false
jobs:
  propose:
    if: github.repository == 'cyrusjamula/family-hub' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Collect scoped issues and propose independent work
        run: node scripts/factory-collect.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
